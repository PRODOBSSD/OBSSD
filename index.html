<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="OBSSD is a New Zealand based producer and visual artist working across music and visuals.">
<link rel="canonical" href="https://obssd.online/">
<meta property="og:title" content="OBSSD | Music and Visuals">
<meta property="og:description" content="OBSSD is a New Zealand based producer and visual artist working across music and visuals.">

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>OBSSD | Music and Visuals</title>

<link rel="preload" href="obssd_shared/custom.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="obssd_shared/custom.css"></noscript>
<script src="obssd_shared/audio-feedback.js" defer></script>

<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  background: #1a1919 !important;
}
body {
  min-height: 100vh;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* TITLE */
.obssd-title {
  position: fixed;
  top: 20px;
  left: 0;
  z-index: 1002;
}
.obssd-title img {
  width: 380px;
  max-width: 100%;
  height: auto;
  display: block;
}
@media (max-width: 1500px) {
  .obssd-title { display: none !important; }
}

/* CONTACT (3D) */
.contact-section {
  position: fixed;
  right: 8px;
  bottom: 8px;
  z-index: 1001;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 270px;
  height: 270px;
  pointer-events: auto;
  cursor: pointer;
}
#contact-3d-canvas {
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: auto;
  position: absolute;
  inset: 0;
}
#contact3DContainer {
  position: fixed;
  right: 8px;
  bottom: 8px;
  z-index: 1001;
  display: block;
  width: 270px;
  height: 270px;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.06s ease-out, filter 0.24s ease-out;
}
#contact3DContainer:hover {
  transform: scale(1.03);
}
#contact3DContainer.flash {
  filter: brightness(1.16);
  transition-duration: 0.06s, 0s;
}
@media (max-width: 1200px) {
  .contact-section { right: 50%; bottom: 12px; transform: translateX(50%); }
  #contact3DContainer { width: 220px; height: 220px; }
}

/* Mobile: position contact lower on the screen to avoid overlapping nav */
@media (max-width: 768px) {
  .contact-section,
  #contact3DContainer {
    position: fixed;
    left: 50%;
    bottom: 24px; /* placed lower to avoid nav overlap */
    top: auto;
    right: auto;
    transform: translateX(-50%);
    width: min(76vw, 360px);
    height: min(76vw, 360px);
    pointer-events: auto;
    cursor: pointer;
    z-index: 1003; /* ensure it's on top of other content */
    touch-action: manipulation; /* reduce default touch gestures */
    -webkit-tap-highlight-color: transparent;
  }

  /* keep transition behavior */
  #contact3DContainer {
    transition: transform 0.06s ease-out, filter 0.24s ease-out;
  }

  /* Prevent jump on touch: include translateX in the scaled transform for mobile */
  #contact3DContainer:hover,
  #contact3DContainer:active {
    transform: translateX(-50%) scale(1.03);
  }
}

/* NAVIGATION BUTTONS */
.nav-buttons-section {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(calc(-50% - 15vw), -50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  pointer-events: none;
}
.nav-button-container {
  position: relative;
  display: block;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.06s ease-out, filter 0.24s ease-out;
  width: 20vw;
}
.nav-button-container:hover {
  transform: scale(1.03);
}
.nav-button-container.flash {
  filter: brightness(1.16);
  transition-duration: 0.06s, 0s;
}
.nav-button-image {
  width: 100%;
  height: auto;
  display: block;
}

/* Staggered alignment for nav buttons - desktop only */
#visualsButton {
  margin-left: 80px;
}
#musicButton {
  margin-right: 0;
}
#storeButton {
  margin-right: 80px;
}

@media (max-width: 1200px) {
  .nav-buttons-section {
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    gap: 12px;
    width: 90%;
    padding: 0 5%;
  }
  .nav-button-container {
    width: 100%;
    margin: 0 !important;
  }
  /* Remove stagger on mobile */
  #visualsButton {
    margin-left: 0;
  }
  #storeButton {
    margin-right: 0;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header class="obssd-title">
  <img src="obssd_assets/OBSSD_TITLE.webp" alt="OBSSD logo">
</header>

<main>
<a class="contact-section" id="contact3DContainer" href="https://obssd.online/contact">
  <canvas id="contact-3d-canvas"></canvas>
  <span class="visually-hidden">Open contact page</span>
</a>

<!-- NAVIGATION BUTTONS -->
<nav class="nav-buttons-section" aria-label="Primary navigation">
  <a class="nav-button-container" id="visualsButton" href="https://obssd.online/visuals">
    <img src="obssd_assets/WEB_VISUALS.webp" class="nav-button-image" alt="Visuals">
  </a>
  <a class="nav-button-container" id="musicButton" href="https://obssd.online/music">
    <img src="obssd_assets/WEB_MUSIC.webp" class="nav-button-image" alt="Music">
  </a>
  <a class="nav-button-container" id="storeButton" href="https://obssd.online/store">
    <img src="obssd_assets/WEB_STORE.webp" class="nav-button-image" alt="Store">
  </a>
</nav>
</main>

<!-- Navigation buttons click handlers -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const visualsButton = document.getElementById("visualsButton");
  const musicButton = document.getElementById("musicButton");
  const storeButton = document.getElementById("storeButton");
  const navButtons = [visualsButton, musicButton, storeButton];

  navButtons.forEach((button) => {
    if (button) {
      button.addEventListener("pointerenter", () => {
        button.classList.add("flash");
        window.setTimeout(() => button.classList.remove("flash"), 30);
      }, { once: false });
    }
  });
  
  if (visualsButton) {
    visualsButton.addEventListener("click", () => {
      window.location.href = "https://obssd.online/visuals";
    });
  }
  
  if (musicButton) {
    musicButton.addEventListener("click", () => {
      window.location.href = "https://obssd.online/music";
    });
  }
  
  if (storeButton) {
    storeButton.addEventListener("click", () => {
      window.location.href = "https://obssd.online/store";
    });
  }
});
</script>

<script type="module">
  const isMobileDevice = window.matchMedia('(max-width: 768px), (pointer: coarse)').matches;
  if (!isMobileDevice) {
    import('./obssd_shared/three.js?v=31');
  }
  import('./obssd_shared/contact.js?v=32');
</script>

</body>
</html>
